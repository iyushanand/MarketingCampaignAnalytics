<div class="d-flex flex-column min-vh-100">
  <app-navbar></app-navbar>
  
  <div class="d-flex flex-grow-1">
    <app-sidebar></app-sidebar>
    <main class="flex-grow-1 bg-light" style="overflow-y: auto;">
      <router-outlet></router-outlet>
    </main>
  </div>
  
  <app-footer></app-footer>
</div>

<!-- Toast Container -->
<div class="toast-container-custom">
  <div *ngFor="let toast of toastService.toasts" 
       [class]="'toast show align-items-center text-white border-0 mb-2 bg-' + toast.type" 
       role="alert" 
       aria-live="assertive" 
       aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body fw-semibold">
        <i class="bi bi-bell-fill me-2"></i>{{ toast.message }}
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="toastService.remove(toast)" aria-label="Close"></button>
    </div>
  </div>
</div>
